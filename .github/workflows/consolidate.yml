name: Consolidate apps catalog

on:
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: apps-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install license lookup dependencies
        run: python -m pip install requests 'pyyaml>=6.0.2'
      - name: Check out configured containers repositories
        run: node scripts/workflow.mjs checkout
      - name: Consolidate every domain and recipe licenses
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: npm run consolidate
      - name: Commit domain catalog files
        shell: bash
        run: |
          paths="$(node scripts/workflow.mjs output-paths)"
          while IFS= read -r path; do
            git add -- "$path"
          done <<< "$paths"
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update domain apps catalogs from container releases'
          git push origin HEAD:main
      # Publish only what main holds, so a failed push leaves the Worker unchanged.
      - name: Publish apps catalogs to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        run: npm run publish:cloudflare
