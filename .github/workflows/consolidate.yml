name: Consolidate apps catalog

on:
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: apps-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check out configured containers repositories
        run: node scripts/workflow.mjs checkout
      - name: Consolidate every domain and enrich DOI and license
        run: npm run consolidate
      - name: Commit domain catalog files
        shell: bash
        run: |
          paths="$(node scripts/workflow.mjs output-paths)"
          while IFS= read -r path; do
            git add -- "$path"
          done <<< "$paths"
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update domain apps catalogs from container releases'
          git push origin HEAD:main
