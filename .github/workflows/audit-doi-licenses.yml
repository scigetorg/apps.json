name: Audit Zenodo DOI licenses

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests 'pyyaml>=6.0.2'
      - name: Test DOI license checks
        run: python -m unittest discover -s test -p 'test_doi_licenses.py'
      - name: Restore previous audit cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/previous-audit.json
          key: zenodo-audit-never-match
          restore-keys: zenodo-audit-
      - name: Audit published software licenses and catalog entries
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.audit_doi_licenses \
            --catalog-root . \
            --previous "$RUNNER_TEMP/previous-audit.json" \
            --output "$RUNNER_TEMP/zenodo-license-audit.json"
      - name: Save audit cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/zenodo-license-audit.json
          key: zenodo-audit-${{ github.run_id }}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-license-audit
          path: ${{ runner.temp }}/zenodo-license-audit.json
