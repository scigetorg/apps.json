name: Audit Zenodo DOI licenses

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests 'pyyaml>=6.0.2'
      - name: Audit published software licenses and catalog entries
        id: audit
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python -m scripts.audit_doi_licenses \
            --catalog-root . \
            --output "$RUNNER_TEMP/zenodo-license-audit.json"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-license-audit
          path: ${{ runner.temp }}/zenodo-license-audit.json
      - name: Create or update issue on mismatches
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/zenodo-license-audit.json
        run: |
          title="Zenodo license audit: mismatches found"
          # Build the issue body from the JSON report.
          body="The weekly Zenodo license audit found records whose licenses differ from apps.json."
          body+=$'\n\n'"**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f "$REPORT" ]; then
            summary="$(python3 -c "
          import json, sys
          report = json.load(open(sys.argv[1]))
          for status, count in sorted(report.get('summary', {}).items()):
              print(f'- {status}: {count}')
          findings = [r for r in report.get('records', []) if r['status'] != 'verified']
          for r in findings[:50]:
              print(f\"- **{r['status']}** \`{r['title']}\`: {r['reason']}\")
          if len(findings) > 50:
              print(f'- … and {len(findings) - 50} more (see the workflow artifact)')
          " "$REPORT")"
            body+=$'\n\n'"$summary"
          fi
          # Update the existing issue if one is open, otherwise create a new one.
          existing="$(gh issue list --label 'license-audit' --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label 'license-audit'
          fi
