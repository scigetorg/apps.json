name: Publish apps catalog DOIs

on:
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Publish only the newest N images (0 = all); use 1 for a first smoke test'
        type: string
        default: '0'

concurrency:
  group: apps-catalog
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests 'pyyaml>=6.0.2'
      - name: Test DOI publication logic
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Plan missing Zenodo depositions
        id: plan
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          test -n "$ZENODO_TOKEN" || { echo 'ZENODO_TOKEN is required' >&2; exit 1; }
          batches="$(python -m scripts.zenodo_catalog plan --catalog-root . --limit "$LIMIT")"
          echo "batches=$batches" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.batches != '[[]]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Matches PUBLISH_JOBS in scripts/zenodo_catalog.py.
      max-parallel: 6
      matrix:
        artifacts: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests 'pyyaml>=6.0.2'
      - name: Publish missing DOI records for this batch
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_JSON: ${{ toJSON(matrix.artifacts) }}
        run: |
          # Stop starting uploads an hour before the job timeout, so a killed
          # job does not leave a half-uploaded Zenodo draft behind.
          python -m scripts.zenodo_catalog publish \
            --catalog-root . --artifacts-json "$ARTIFACTS_JSON" --time-budget-minutes 300

